schema_version = 1
name = "m0-frozen-prefix-v1"
provider = "mock"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
repetitions = 3
dispatch_mode = "sequential"
branch_delay_seconds = 0.0
timeout_seconds = 60.0
output_dir = "../runs"
document = "../data/m0/annual_report_sample.md"
system_prompt = "../ai-runtime/prompts/m0-v1/system.txt"
answer_suffix = "../ai-runtime/prompts/m0-v1/answer.txt"
cracking_suffix = "../ai-runtime/prompts/m0-v1/cracking.txt"
document_version = "synthetic-annual-2025-v1"
parser_version = "utf8-text-v1"
prompt_version = "m0-v1"
policy_version = "m0-observation-v1"

[request]
temperature = 0.0
max_tokens = 768
thinking = "disabled"
response_format = "json_object"

[mock]
scenario = "happy"
seed = 42

# Prices are intentionally unset. Before a live cost measurement, fill all
# three rates from your account's current price sheet (per 1,000,000 tokens).
# Mock always uses a separate synthetic price sheet, in MOCK units.
[pricing]
currency = "USD"
version = "unconfigured"
source = "https://api-docs.deepseek.com/quick_start/pricing/"
input_miss_per_million = ""
input_hit_per_million = ""
output_per_million = ""

