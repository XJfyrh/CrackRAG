[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crackrag-m0"
version = "0.1.0"
description = "Reproducible frozen-prefix Answer/Cracking experiments"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "python-dotenv==1.2.1"]

[project.scripts]
crackrag-m0 = "crackrag_m0.cli:main"

[tool.setuptools.packages.find]
where = ["ai-runtime/src"]

