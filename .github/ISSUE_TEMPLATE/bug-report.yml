name: Bug report
description: Report a reproducible product or demo-site problem.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Static replay, Local mock, Real provider]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic data where possible. Do not paste tokens, private traces, or full third-party PDFs.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
