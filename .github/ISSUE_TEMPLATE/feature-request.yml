name: Feature request
description: Propose a user-visible improvement within or beyond the current scope.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user and task before suggesting an implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: What would a successful result look like?
    validations:
      required: true
