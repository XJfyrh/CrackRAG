name: crackrag-m3
services:
  postgres:
    image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: crackrag_m3
      POSTGRES_USER: crackrag
      POSTGRES_PASSWORD: local-m3-development
    ports: ["127.0.0.1:55435:5432"]
    volumes: ["m3-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crackrag -d crackrag_m3"]
      interval: 3s
      timeout: 3s
      retries: 30
  runtime:
    build: {context: .., dockerfile: deploy/M3Runtime.Dockerfile}
    stop_grace_period: 20s
    environment:
      M1_DATA_TOOLS_ADDRESS: api:50052
      M1_RUNTIME_ADDRESS: 0.0.0.0:50051
      M1_INTERNAL_TOKEN: ${M3_INTERNAL_TOKEN:-local-m3-service-token}
      M1_MODEL_PROVIDER: mock
      M1_EMBEDDING_MODE: fixture
      M1_EMBEDDING_DIRECTORY: /models/bge-m3
      M1_PRICE_SNAPSHOT: ${M3_PRICE_SNAPSHOT:-/app/config/m1-pricing.json}

      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes: ["${M3_MODEL_DIRECTORY:-../tmp/m1-models}:/models:ro"]
  api:
    build: {context: .., dockerfile: deploy/API.Dockerfile}
    stop_grace_period: 30s
    environment:
      M1_DATABASE_URL: postgres://crackrag:local-m3-development@postgres:5432/crackrag_m3?sslmode=disable
      M1_HTTP_ADDRESS: 0.0.0.0:8080
      M1_GRPC_ADDRESS: 0.0.0.0:50052
      M1_RUNTIME_ADDRESS: runtime:50051
      M1_INTERNAL_TOKEN: ${M3_INTERNAL_TOKEN:-local-m3-service-token}
      M1_MODEL_PROVIDER: mock
      M1_BLOB_DIRECTORY: /data/blobs
      M1_MIGRATIONS_DIRECTORY: /app/migrations
      M1_WEB_DIRECTORY: /app/web
      M1_PRICE_SNAPSHOT: ${M3_PRICE_SNAPSHOT:-/app/config/m1-pricing.json}
    ports: ["127.0.0.1:18083:8080"]
    volumes: ["../tmp/m3-blobs:/data/blobs"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  m3-postgres-data:
