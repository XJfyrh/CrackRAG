name: crackrag-m1
services:
  postgres:
    image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: crackrag
      POSTGRES_USER: crackrag
      POSTGRES_PASSWORD: local-m1-development
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crackrag -d crackrag"]
      interval: 3s
      timeout: 3s
      retries: 30
  runtime:
    build:
      context: ..
      dockerfile: deploy/Runtime.Dockerfile
    environment:
      M1_DATA_TOOLS_ADDRESS: api:50052
      M1_RUNTIME_ADDRESS: 0.0.0.0:50051
      M1_INTERNAL_TOKEN: ${M1_INTERNAL_TOKEN:-local-m1-service-token}
      M1_MODEL_PROVIDER: ${M1_MODEL_PROVIDER:-mock}
      M1_MOCK_SCENARIO: ${M1_MOCK_SCENARIO:-happy}
      M1_EMBEDDING_MODE: ${M1_EMBEDDING_MODE:-bge-m3}
      M1_EMBEDDING_DIRECTORY: /models/bge-m3
      M1_PRICE_SNAPSHOT: /app/config/m1-pricing.json
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes: ["../tmp/m1-models:/models:ro"]
    healthcheck:
      test: ["CMD", "python", "-m", "crackrag_m1.health"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 8g
  api:
    build:
      context: ..
      dockerfile: deploy/API.Dockerfile
    environment:
      M1_DATABASE_URL: postgres://crackrag:local-m1-development@postgres:5432/crackrag?sslmode=disable
      M1_HTTP_ADDRESS: 0.0.0.0:8080
      M1_GRPC_ADDRESS: 0.0.0.0:50052
      M1_RUNTIME_ADDRESS: runtime:50051
      M1_INTERNAL_TOKEN: ${M1_INTERNAL_TOKEN:-local-m1-service-token}
      M1_API_TOKENS: ${M1_API_TOKENS:-demo-alpha=tenant-alpha,demo-beta=tenant-beta}
      M1_MODEL_PROVIDER: ${M1_MODEL_PROVIDER:-mock}
      M1_BLOB_DIRECTORY: /data/blobs
      M1_MIGRATIONS_DIRECTORY: /app/migrations
      M1_WEB_DIRECTORY: /app/web
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["../tmp/m1-blobs:/data/blobs"]
    depends_on:
      postgres: {condition: service_healthy}
      runtime: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/api", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
